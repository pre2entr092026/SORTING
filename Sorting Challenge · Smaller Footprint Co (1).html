<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorting Challenge · Smaller Footprint Co.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#eaf2ee; --surface:#ffffff; --ink:#15302a; --muted:#56706a; --line:#cfddd6;
  --brand:#04475a; --brand-ink:#ffffff;
  --wet:#2a9a58; --dry:#2c6bd3; --san:#d63f38; --spc:#343b41;
  --good:#1e8a4c; --bad:#c8362f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a17; --surface:#16261f; --ink:#e6f2ed; --muted:#93aca4; --line:#2a4037;
    --brand:#4fc9a4; --brand-ink:#08211a; --spc:#5b656d; --good:#4fd08a; --bad:#ff7a70;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a17; --surface:#16261f; --ink:#e6f2ed; --muted:#93aca4; --line:#2a4037;
  --brand:#4fc9a4; --brand-ink:#08211a; --spc:#5b656d; --good:#4fd08a; --bad:#ff7a70;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta",system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;font-size:17px;line-height:1.45;min-height:100vh}
h1,h2,h3,.disp{font-family:"Baloo 2","Mukta",system-ui,sans-serif;line-height:1.1;margin:0}
.app{max-width:520px;margin:0 auto;padding:14px 16px 28px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{background:#fff;border-radius:12px;padding:5px 10px;line-height:0;box-shadow:0 0 0 1px var(--line)}
.logo img{height:34px;width:auto;display:block}
.lang{display:flex;border:2px solid var(--brand);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--brand);font:inherit;font-weight:700;padding:4px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1{font-size:40px;font-weight:800;margin:6px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.modes{display:grid;gap:10px;margin-bottom:12px}
.mode{border:2px solid var(--brand);background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.mode b{font-family:"Baloo 2",sans-serif;font-size:22px;display:block}
.mode span{color:var(--muted);font-size:15px}
.mode i{font-style:normal;font-size:34px}
.mode:hover{background:var(--brand);color:var(--brand-ink)}
.mode:hover span{color:var(--brand-ink)}
input[type=text]{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:16px}
.legend{display:grid;gap:8px;margin:8px 0 18px}
.lg{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.dot{flex:none;width:26px;height:26px;border-radius:8px}
.lg small{color:var(--muted);display:block;font-size:14px;line-height:1.3}
.thk{--c:#9a5b00}
.wet{--c:var(--wet)} .dry{--c:var(--dry)} .san{--c:var(--san)} .spc{--c:var(--spc)}
.dot{background:var(--c)}
h2{font-size:24px;margin:16px 0 8px}
.note{font-size:13.5px;color:var(--muted);margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:5px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
/* play */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-weight:700}
.bar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.stage{min-height:318px;display:flex;flex-direction:column;align-items:center;gap:10px}
.card{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;width:min(78%,280px);background:var(--surface);border:2px solid var(--line);border-radius:26px;text-align:center;padding:16px 12px;box-shadow:0 8px 0 var(--line);transition:transform .2s}
.card.drag{cursor:grabbing;transition:none;z-index:5;position:relative;box-shadow:0 14px 26px rgba(0,0,0,.25)}
.card .emo{font-size:76px;line-height:1.1}
.card .emo svg{width:84px;height:84px;display:block;margin:0 auto}
.miss .e svg{width:30px;height:30px;display:block}
.card .nm{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:24px;line-height:1.15}
.card .nm2{color:var(--muted);font-size:16px}
.card.done{opacity:.55}
.fb{width:100%;border-radius:16px;padding:10px 14px;border:2px solid var(--line);background:var(--surface)}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.fb b{font-family:"Baloo 2",sans-serif;font-size:20px}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb p{margin:2px 0 8px;font-size:16px}
.go{background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:8px 20px;font-weight:700;font-size:17px;cursor:pointer}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bin{position:relative;border:0;border-radius:6px 6px 18px 18px;background:var(--c);color:#fff;min-height:96px;padding:22px 8px 8px;cursor:pointer;text-align:center;font-weight:700;line-height:1.15;transition:transform .12s,filter .12s}
.bins .bin:nth-child(5){grid-column:1/-1;min-height:84px}
.bin::before{content:"";position:absolute;left:-4px;right:-4px;top:0;height:14px;border-radius:8px;background:rgba(0,0,0,.28)}
.bin .k{position:absolute;right:8px;top:18px;font-size:12px;opacity:.75}
.bin .t{font-family:"Baloo 2",sans-serif;font-size:19px;display:block}
.bin .s{font-size:13.5px;font-weight:600;opacity:.92}
.bin:disabled{filter:saturate(.6) brightness(.85);cursor:default}
.bin.hot{transform:scale(1.06);outline:4px solid var(--ink)}
.hint{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
/* result */
.big{font-family:"Baloo 2",sans-serif;font-size:64px;font-weight:800;color:var(--brand);line-height:1}
.pen{color:var(--muted);margin:2px 0 8px}
.tip{background:var(--surface);border:2px dashed var(--brand);border-radius:16px;padding:12px 14px;margin:14px 0}
.tip b{font-family:"Baloo 2",sans-serif;font-size:19px;color:var(--brand)}
.miss{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.miss .e{font-size:28px}
.chip{margin-left:auto;color:#fff;background:var(--c);border-radius:999px;padding:1px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand);border-radius:12px;padding:8px 18px;font-weight:700;font-size:17px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- state ---------- */
var lang = (navigator.language||"").toLowerCase().indexOf("hi")===0 ? "hi" : "en";
var view = "start", mode = "kids", player = "";
var round = [], idx = 0, wrong = 0, elapsed = 0, startT = null, missed = [], phase = "ask", lastRes = null;
var $ = function(s){return document.querySelector(s)};
function t(k){return T[lang][k]}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function L(en,hi){return lang==="hi"?hi:en}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function fmt(s){return s.toFixed(1)+" "+t("sec")}

function buildRound(m){
  var pool = m==="kids" ? ITEMS.filter(function(i){return i[6]===1}) : ITEMS.slice();
  var n = m==="kids" ? 12 : 20, groups = {};
  ALLKEYS.forEach(function(k){groups[k]=shuffle(pool.filter(function(i){return i[1]===k}))});
  var out = [];
  while(out.length<n){
    var added = false;
    ALLKEYS.forEach(function(k){ if(out.length<n && groups[k].length){out.push(groups[k].shift());added=true} });
    if(!added) break;
  }
  return shuffle(out);
}

/* ---------- storage (optional, per device) ---------- */
function loadBest(){try{return JSON.parse(localStorage.getItem("fbc-best-v1")||"[]")}catch(e){return []}}
function saveBest(e){try{var a=loadBest();a.push(e);a.sort(function(x,y){return x.t-y.t});
  var kept=[],c={kids:0,all:0};a.forEach(function(r){if(c[r.m]<5){c[r.m]++;kept.push(r)}});
  localStorage.setItem("fbc-best-v1",JSON.stringify(kept))}catch(e){}}

/* ---------- render ---------- */
function setLangButtons(){
  $("#lEn").setAttribute("aria-pressed",lang==="en");
  $("#lHi").setAttribute("aria-pressed",lang==="hi");
  document.documentElement.lang = lang;
  document.title = t("title")+" · "+BRAND_NAME;
}
function render(){ setLangButtons(); if(view==="start")renderStart(); else if(view==="play")renderPlay(); else renderResult(); }

function renderStart(){
  var legend = ALLKEYS.map(function(k){var b=BINS[k];
    return '<div class="lg '+b.cls+'"><span class="dot"></span><div><b>'+L(b.en,b.hi)+' · '+L(b.ce,b.ch)+'</b><small>'+L(b.ee,b.eh)+'</small></div></div>'}).join("");
  var best = loadBest();
  function tbl(m){var r=best.filter(function(x){return x.m===m});
    return r.length? '<table>'+r.map(function(x,i){return '<tr><td>'+(i+1)+'. '+esc(x.n)+'</td><td>'+x.t.toFixed(1)+' '+t("sec")+'</td></tr>'}).join("")+'</table>' : ''}
  var bt = tbl("kids"), ba = tbl("all");
  var bestHtml = (bt||ba) ? '<h2>'+t("best")+'</h2>'+(bt?'<b>'+t("kids")+'</b>'+bt:'')+(ba?'<b>'+t("all")+'</b>'+ba:'') : '';
  $("#screen").innerHTML =
    '<h1>'+t("title")+'</h1><p class="sub">'+t("sub")+'</p>'+
    '<input type="text" id="nm" maxlength="20" placeholder="'+esc(t("name"))+'" value="'+esc(player)+'" aria-label="'+esc(t("name"))+'">'+
    '<div class="modes">'+
      '<button class="mode" data-m="kids"><div><b>'+t("kids")+'</b><span>'+t("kidsD")+'</span></div><i>🧒</i></button>'+
      '<button class="mode" data-m="all"><div><b>'+t("all")+'</b><span>'+t("allD")+'</span></div><i>🧑‍🤝‍🧑</i></button>'+
    '</div><h2>'+t("legend")+'</h2><div class="legend">'+legend+'</div>'+bestHtml+
    '';
  document.querySelectorAll(".mode").forEach(function(b){b.onclick=function(){player=($("#nm").value||"").trim();startGame(b.dataset.m)}});
}

function startGame(m){
  mode=m; round=buildRound(m); idx=0; wrong=0; elapsed=0; missed=[]; view="play"; phase="ask"; lastRes=null;
  startT=performance.now(); render();
}

function renderPlay(){
  var it = round[idx], pct = Math.round(idx/round.length*100);
  var n1 = L(it[2],it[3]), n2 = L(it[3],it[2]);
  var AK = activeKeys();
  var bins = AK.map(function(k,i){var b=BINS[k];
    return '<button class="bin '+b.cls+'" data-k="'+k+'" aria-label="'+esc(L(b.en,b.hi)+', '+L(b.ce,b.ch))+'"><span class="k">'+(i+1)+'</span><span class="t">'+L(b.en,b.hi)+'</span><span class="s">'+L(b.ce,b.ch)+'</span></button>'}).join("");
  $("#screen").innerHTML =
    '<div class="prog"><span>'+(idx+1)+' / '+round.length+'</span><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
    '<div class="stage"><div id="card" class="card" role="img" aria-label="'+esc(n1)+'"><div class="emo" aria-hidden="true">'+icon(it)+'</div><div class="nm">'+n1+'</div><div class="nm2">'+n2+'</div></div><div id="fb" hidden></div></div>'+
    '<div class="bins">'+bins+'</div><p class="hint">'+t("hint").replace("{n}",AK.length)+'</p>';
  document.querySelectorAll(".bin").forEach(function(b){b.onclick=function(){answer(b.dataset.k)}});
  if(phase==="fb") showFeedback();
}

function answer(k){
  if(view!=="play"||phase!=="ask") return;
  if(startT!==null){elapsed += (performance.now()-startT)/1000; startT=null;}
  var it = round[idx], right = it[1]===k;
  if(!right){wrong++; missed.push(it); try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
  lastRes = {right:right, k:k};
  phase="fb"; showFeedback();
}

function showFeedback(){
  var it = round[idx], b = BINS[it[1]], last = idx===round.length-1;
  document.querySelectorAll(".bin").forEach(function(x){x.disabled=true});
  $("#card").classList.add("done");
  var head = lastRes.right ? t("ok") : t("no").replace("{b}", L(b.en,b.hi)+" · "+L(b.ce,b.ch));
  var fb = $("#fb"); fb.hidden=false; fb.className="fb "+(lastRes.right?"ok":"no");
  fb.innerHTML = '<b>'+head+'</b><p>'+L(it[4],it[5])+'</p><button class="go" id="nx">'+(last?t("finish"):t("next"))+'</button>';
  $("#nx").onclick = next; $("#nx").focus();
}

function next(){
  if(idx===round.length-1){finishGame();return}
  idx++; phase="ask"; startT=performance.now(); renderPlay();
}

function finishGame(){
  var total = elapsed + wrong*5;
  lastRes = {total:total, acc: Math.round((round.length-wrong)/round.length*100), tip: TIPS[Math.floor(Math.random()*TIPS.length)]};
  saveBest({n: player||t("anon"), m: mode, t: total});
  view="result"; render();
}

function renderResult(){
  var r = lastRes, right = round.length-wrong;
  var rank = r.acc===100?t("r1"):r.acc>=85?t("r2"):r.acc>=60?t("r3"):t("r4");
  var miss = missed.length ? '<h2>'+t("missed")+'</h2>'+missed.map(function(it){var b=BINS[it[1]];
    return '<div class="miss"><span class="e">'+icon(it)+'</span><span>'+L(it[2],it[3])+'</span><span class="chip '+b.cls+'">'+L(b.ce,b.ch)+'</span></div>'}).join("") : "";
  $("#screen").innerHTML =
    '<h2>'+rank+'</h2><p class="sub" style="margin:0">'+t("time")+'</p><div class="big">'+r.total.toFixed(1)+' '+t("sec")+'</div>'+
    '<p class="pen">'+(wrong? t("pen").replace("{n}",wrong) : t("nopen"))+'</p>'+
    '<p><b>'+right+'</b> '+t("of")+' <b>'+round.length+'</b> '+t("correct")+'</p>'+
    '<div class="tip"><b>👣 '+t("tip")+'</b><br>'+L(r.tip[0],r.tip[1])+'</div>'+miss+
    '<div class="row"><button class="go" id="again">'+t("again")+'</button><button class="ghost" id="home">'+t("home")+'</button><button class="ghost" id="share">'+t("share")+'</button></div>'+
    '<p class="note" id="msg" aria-live="polite"></p>';
  $("#again").onclick=function(){startGame(mode)};
  $("#home").onclick=function(){view="start";render()};
  $("#share").onclick=function(){
    var txt = "👣 "+t("title")+" · "+BRAND_NAME+": "+right+"/"+round.length+" "+t("correct")+", "+r.total.toFixed(1)+" "+t("sec")+"!";
    var url = location.href;
    if(navigator.share){navigator.share({text:txt,url:url}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(txt+" "+url).then(function(){$("#msg").textContent=t("copied")}).catch(function(){})}
  };
}

/* ---------- drag & drop ---------- */
var drag = null;
function binAt(x,y){var els=document.elementsFromPoint(x,y);for(var i=0;i<els.length;i++){if(els[i].classList&&els[i].classList.contains("bin"))return els[i]}return null}
function hot(b){document.querySelectorAll(".bin").forEach(function(x){x.classList.toggle("hot",x===b)})}
document.addEventListener("pointerdown",function(e){
  var c = e.target.closest && e.target.closest("#card");
  if(!c||view!=="play"||phase!=="ask") return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,el:c};
  try{c.setPointerCapture(e.pointerId)}catch(err){}
  c.classList.add("drag");
});
document.addEventListener("pointermove",function(e){
  if(!drag||e.pointerId!==drag.id) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.el.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(dx/30)+"deg)";
  hot(binAt(e.clientX,e.clientY));
});
function endDrag(e,drop){
  if(!drag||e.pointerId!==drag.id) return;
  var b = drop ? binAt(e.clientX,e.clientY) : null, el=drag.el;
  drag=null; hot(null); el.classList.remove("drag"); el.style.transform="";
  if(b) answer(b.dataset.k);
}
document.addEventListener("pointerup",function(e){endDrag(e,true)});
document.addEventListener("pointercancel",function(e){endDrag(e,false)});

/* ---------- keyboard, tab visibility, language ---------- */
document.addEventListener("keydown",function(e){
  if(view==="play"&&phase==="ask"){var i="12345".indexOf(e.key), AK=activeKeys(); if(i>-1 && i<AK.length) answer(AK[i]);}
});
document.addEventListener("visibilitychange",function(){
  if(view!=="play"||phase!=="ask") return;
  if(document.hidden){ if(startT!==null){elapsed+=(performance.now()-startT)/1000;startT=null} }
  else if(startT===null){ startT=performance.now(); }
});
$("#lEn").onclick=function(){lang="en";render()};
$("#lHi").onclick=function(){lang="hi";render()};
render();
</script>
</body>
</html>
